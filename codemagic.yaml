workflows:
  tdb-ios-testflight:
    name: Tdb iOS TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: tudo
    environment:
      flutter: 3.50.0
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.hysgit.tdb
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Resolve packages
        script: flutter pub get
      - name: Analyze and test
        script: |
          set -e
          flutter analyze
          flutter test
      - name: Set up App Store signing
        script: xcode-project use-profiles
      - name: Build Tdb IPA
        script: |
          set -e
          flutter build ipa --release \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist="$HOME/export_options.plist"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/**/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Internal testing follows the existing app's flow without external beta review.
        submit_to_testflight: false
        beta_groups:
          - Tdb 内测

  tdb-ios-simulator:
    name: Tdb iOS Simulator
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events: [push]
      branch_patterns:
        - pattern: main
          include: true
          source: true
    environment:
      flutter: 3.50.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Resolve packages
        script: flutter pub get
      - name: Analyze and test
        script: |
          set -e
          flutter analyze
          flutter test
      - name: Build simulator package
        script: |
          set -e
          flutter build ios --simulator --debug --build-number="$BUILD_NUMBER"
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app build/ios/Tdb-Simulator.zip
    artifacts:
      - build/ios/Tdb-Simulator.zip
      - /tmp/xcodebuild_logs/**/*.log

  tdb-ios-native-checks:
    name: Tdb iOS Native Checks
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.50.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Resolve packages
        script: flutter pub get
      - name: Verify real native audio export
        script: |
          set -e
          xcodebuild -version
          python3 scripts/run_ios_audio_probe.py --timeout 1200
      - name: Verify real LAN upload and waveform
        script: |
          set -e
          python3 scripts/run_ios_transfer_probe.py --timeout 1500
    artifacts:
      - build/ios-audio-probe.log
      - build/ios-runtime-probe.log
