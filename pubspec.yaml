name: tingdubao
description: 听读宝 Flutter 重建版
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.11.1
  just_audio: ^0.10.6
  just_waveform: ^0.0.7
  audio_session: ^0.2.4
  file_picker: ^10.3.10
  path_provider: ^2.1.6
  record: ^6.2.1
  video_player: ^2.10.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/demo/
